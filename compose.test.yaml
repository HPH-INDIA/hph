name: hph-test

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.test
    ports:
      - "${TEST_BIND_ADDRESS:-127.0.0.1}:${TEST_FRONTEND_PORT:-8082}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ../hph-backend
      dockerfile: Dockerfile.test
    env_file:
      - path: ../hph-backend/.env.test
        format: raw
    environment:
      PORT: "8080"
      SESSION_COOKIE_SECURE: "${TEST_SECURE_COOKIES:-false}"
      FRONTEND_LOGIN_URL: "${TEST_FRONTEND_ORIGIN:-http://localhost:8082}/login"
      CORS_ALLOWED_ORIGINS: "${TEST_FRONTEND_ORIGIN:-http://localhost:8082},http://127.0.0.1:${TEST_FRONTEND_PORT:-8082}"
    ports:
      - "127.0.0.1:${TEST_BACKEND_PORT:-8083}:8080"
    restart: unless-stopped
