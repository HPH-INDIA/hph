name: hph
services:
  frontend:
    build:
      context: .
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
  backend:
    build:
      context: ../hph-backend
    env_file:
      - ../hph-backend/.env.render
    environment:
      PORT: "8080"
      IMPORT_EMBEDDED_PROCESSING: "true"
      IMPORT_MAX_FILE_BYTES: "50000000"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      FRONTEND_LOGIN_URL: "${FRONTEND_LOGIN_URL:-http://localhost:8080/login}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
